{% extends 'base.html' %}
{% load static %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-body p-4">
                <div class="text-center mb-3">
                    <img src="{% static 'images/ford-bronco.jpeg' %}" alt="Logo" class="img-fluid mb-2" style="max-height: 80px;">
                    <h4 class="card-title text-primary">Inicio de Sesión</h4>
                </div>
                <hr>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'inicio' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-dark">Ingresar</button>
                    </div>
                </form>
                <hr>
                <div class="text-center">
                    <p class="mb-0">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
